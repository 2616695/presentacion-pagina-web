<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Un Poco de Genética | Laboratorio</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="explorador.html">Explorador</a>
        <a href="laboratorio.html">Laboratorio</a>
    </nav>

    <h1>Laboratorio Genético</h1>

    <div class="caja">
        <h2>Registrar Perfil</h2>
        <p>Completá el formulario para registrar tu perfil genético.</p>

        <label>Nombre:</label>
        <input type="text" id="reg-nombre" placeholder="Tu nombre">

        <label>Edad:</label>
        <input type="number" id="reg-edad" placeholder="Tu edad" min="1" max="120">

        <label>Correo:</label>
        <input type="email" id="reg-email" placeholder="tu@email.com">

        <label>Tipo de sangre:</label>
        <select id="reg-sangre">
            <option value="">-- Seleccionar --</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select>

        <label>Color de ojos:</label>
        <select id="reg-ojos">
            <option value="">-- Seleccionar --</option>
            <option value="Marron">Marrón</option>
            <option value="Verde">Verde</option>
            <option value="Azul">Azul</option>
            <option value="Gris">Gris</option>
        </select>

        <label>Tipo de cabello:</label>
        <select id="reg-cabello">
            <option value="">-- Seleccionar --</option>
            <option value="Rizado">Rizado</option>
            <option value="Ondulado">Ondulado</option>
            <option value="Liso">Liso</option>
        </select>

        <button onclick="registrar()">Registrar</button>
        <button onclick="limpiarFormulario()">Limpiar</button>

        <p id="msg-registro"></p>
    </div>

    <div class="caja">
        <h2>Perfiles Registrados</h2>
        <p>Total de perfiles: <strong id="contador">0</strong></p>
        <div id="lista-registros">
            <p>Todavía no hay perfiles registrados.</p>
        </div>
    </div>

    <footer>
        Un Poco de Genética · 2026
    </footer>

    <script src="codigo.js"></script>
</body>
</html>
